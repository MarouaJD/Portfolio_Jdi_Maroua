  <style>
    /* ── SKILLS PAGE SPECIFIC ── */
    .skills-page{position:relative;z-index:1;padding:140px 6% 6rem;max-width:1200px;margin:0 auto}

    /* CATEGORY TABS */
    .cat-tabs{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-bottom:4rem}
    .cat-tab{padding:.55rem 1.4rem;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);cursor:pointer;font-family:var(--ff-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;transition:all .25s}
    .cat-tab.active,.cat-tab:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(233,185,73,.06)}

    /* SKILL CATEGORY BLOCK */
    .skills-category{margin-bottom:4rem;opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
    .skills-category.vis{opacity:1;transform:translateY(0)}
    .cat-header{display:flex;align-items:center;gap:1rem;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
    .cat-icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(201,132,58,.1);border:1px solid var(--border);flex-shrink:0}
    .cat-title{font-size:1.3rem;font-weight:800;color:var(--text)}
    .cat-sub{color:var(--muted);font-size:.8rem;font-family:var(--ff-mono);margin-top:.2rem}

    /* SKILL BARS */
    .skill-list{display:flex;flex-direction:column;gap:1.2rem}
    .skill-item{display:grid;grid-template-columns:160px 1fr 48px;align-items:center;gap:1rem}
    .skill-name{font-size:.9rem;font-weight:600;color:var(--text)}
    .skill-track{height:6px;background:rgba(128,128,128,.12);border-radius:3px;overflow:hidden;position:relative}
    .skill-fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width 1.2s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px var(--glow-c)}
    .skills-category.vis .skill-fill{width:var(--w)}
    .skill-pct{font-family:var(--ff-mono);font-size:.7rem;color:var(--cyan);text-align:right}

    /* TECH BADGES GRID */
    .badges-wrap{margin-top:3rem}
    .badges-title{font-family:var(--ff-mono);font-size:.7rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:1.2rem}
    .badges-grid{display:flex;flex-wrap:wrap;gap:.6rem}
    .badge-tech{padding:.4rem 1rem;background:var(--panel);border:1px solid var(--border);border-radius:4px;font-family:var(--ff-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;transition:all .25s;cursor:default}
    .badge-tech:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(233,185,73,.06);transform:translateY(-2px)}

    /* STATS ROW */
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:4rem}
    .stat-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:1.5rem;text-align:center;transition:border-color .3s,transform .3s}
    .stat-box:hover{border-color:var(--cyan);transform:translateY(-4px)}
    .stat-box .num{font-family:var(--ff-mono);font-size:2rem;font-weight:700;color:var(--cyan);display:block}
    .stat-box .lbl{color:var(--muted);font-size:.75rem;font-family:var(--ff-mono);letter-spacing:.08em;text-transform:uppercase;margin-top:.3rem}

    @media(max-width:600px){
      .skill-item{grid-template-columns:120px 1fr 40px}
      .skill-name{font-size:.8rem}
    }
  </style>

<script>
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')}
if(localStorage.getItem('theme')==='light')document.body.classList.add('light');
function setLang(l){document.getElementById('btn-fr').classList.toggle('active-lang',l==='fr');document.getElementById('btn-en').classList.toggle('active-lang',l==='en');document.querySelectorAll('[data-'+l+']').forEach(el=>el.innerHTML=el.getAttribute('data-'+l));localStorage.setItem('lang',l)}
window.addEventListener('scroll',()=>{const n=document.getElementById('navbar');if(n)n.classList.toggle('scrolled',window.scrollY>50)});

function section(title,html){return html?'<div class="parcours-sec"><h2>'+title+'</h2>'+html+'</div>':''}
function item(p){
  return '<div class="tl-item"><span class="tl-period">'+esc(p.period)+'</span>'+
    '<div class="tl-title">'+esc(p.title)+'</div><div class="tl-org">'+esc(p.org)+'</div>'+
    ((p.points&&p.points.length)?'<ul class="tl-points">'+p.points.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
    (p.tech?'<div class="tl-tech">'+p.tech.split(',').map(t=>'<span>'+esc(t.trim())+'</span>').join('')+'</div>':'')+'</div>';
}
const all=getParcours(), langues=getLangues();
const exp=all.filter(p=>p.type==='experience'), form=all.filter(p=>p.type!=='experience');
document.getElementById('parcours-root').innerHTML=
  section('Expérience professionnelle',exp.length?'<div class="tl">'+exp.map(item).join('')+'</div>':'')+
  section('Formation',form.length?'<div class="tl">'+form.map(item).join('')+'</div>':'')+
  section('Langues',langues.length?'<div class="lang-grid">'+langues.map(l=>'<div class="lang-card"><b>'+esc(l.name)+'</b><small>'+esc(l.level)+'</small><div class="lang-bar"><i style="width:'+(+l.pct||0)+'%"></i></div></div>').join('')+'</div>':'');

const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target)}}),{threshold:.05});
document.querySelectorAll('.tl-item,.lang-card').forEach(c=>obs.observe(c));
setTimeout(()=>document.querySelectorAll('.tl-item,.lang-card').forEach(c=>{if(c.getBoundingClientRect().top<innerHeight)c.classList.add('vis')}),100);
const sv=localStorage.getItem('lang');if(sv&&sv!=='fr')setTimeout(()=>setLang(sv),100);
</script>
